name: VOID Static Discovery Mirror V2

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "current-state-v2.json"
      - "mirror/**"
      - ".well-known/**"
      - "public-node/agents/**"
      - "discovery/**"
      - "mcp/**"
      - "a2a/**"
      - "live/**"
      - "work/**"
      - "clients/**"
      - "standards/**"
      - "README.md"
      - "index.html"
      - "llms.txt"
      - "llms-full.txt"
      - "pages-manifest-v1.json"
      - "integrity/**"
      - "scripts/prove_void_pages_rehabilitation_v2.mjs"
      - ".github/workflows/void-free-discovery-pages-integration-v1.yml"
      - ".github/workflows/void-public-agent-canary-v1.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "current-state-v2.json"
      - "mirror/**"
      - ".well-known/**"
      - "public-node/agents/**"
      - "discovery/**"
      - "mcp/**"
      - "a2a/**"
      - "live/**"
      - "work/**"
      - "clients/**"
      - "standards/**"
      - "README.md"
      - "index.html"
      - "llms.txt"
      - "llms-full.txt"
      - "scripts/prove_void_pages_rehabilitation_v2.mjs"

permissions:
  contents: read

concurrency:
  group: void-static-discovery-mirror-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Prove current source-bound static mirror
        run: |
          node --check scripts/prove_void_pages_rehabilitation_v2.mjs
          node scripts/prove_void_pages_rehabilitation_v2.mjs
