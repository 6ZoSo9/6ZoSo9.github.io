name: VOID Public Pages Canary V2

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"
  push:
    branches: [main]
    paths:
      - "current-state-v2.json"
      - "mirror/**"
      - "public-node/agents/**"
      - "discovery/index-v1.json"
      - "canary/public-canary-v2.py"
      - "scripts/prove_void_pages_rehabilitation_v2.mjs"
      - ".github/workflows/void-public-agent-canary-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-public-pages-canary-v2
  cancel-in-progress: true

jobs:
  local-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: node scripts/prove_void_pages_rehabilitation_v2.mjs

  public-pages:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check public Pages mirror
        run: |
          mkdir -p canary/evidence
          python3 canary/public-canary-v2.py canary/evidence/void-public-pages-canary-v2.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: void-public-pages-canary-v2-${{ github.run_id }}
          path: canary/evidence/void-public-pages-canary-v2.json
          if-no-files-found: error
          retention-days: 30
